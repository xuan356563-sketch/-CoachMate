[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "trainflow-backend"
version = "0.1.0"
description = "TrainFlow 大陆云端后端基线"
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "app-store-server-library>=3.1,<4",
  "cryptography>=49,<50",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "Pillow>=11.0,<12",
  "python-multipart>=0.0.20,<1",
  "redis>=6.2,<7",
  "sqlalchemy>=2.0,<3",
  "tencentcloud-sdk-python>=3.0,<4",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]
