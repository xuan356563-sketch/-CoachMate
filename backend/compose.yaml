services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trainflow
      POSTGRES_USER: trainflow
      POSTGRES_PASSWORD: trainflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainflow -d trainflow"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - trainflow_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - trainflow_redis_data:/data

  api:
    build: .
    env_file: .env
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  ops-api:
    build: .
    env_file: .env
    command: >
      uvicorn app.ops_main:app --host 0.0.0.0 --port 8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"

  ops-web:
    build:
      context: ../ops-web
    depends_on:
      - ops-api
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  trainflow_postgres_data:
  trainflow_redis_data:
