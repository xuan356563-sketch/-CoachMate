<!DOCTYPE html>
<html>
<head>
  <!--
    如果 Web 应用部署在非根路径，请调整下面的 base href。

    该路径需要以 "/" 开头和结尾。

    参考资料：
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    这里是 Flutter 构建时会被 `--base-href` 参数替换的占位符。
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TrainFlow AI 训练决策辅助系统 MVP">

  <!-- iOS 元信息与图标 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TrainFlow AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- 网站图标 -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TrainFlow AI</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
