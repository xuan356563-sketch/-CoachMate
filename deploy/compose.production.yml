services:
  migration:
    image: ${TRAINMATE_API_IMAGE:?必须设置 TRAINMATE_API_IMAGE}
    env_file:
      - ${TRAINMATE_ENV_FILE:?必须设置 TRAINMATE_ENV_FILE}
    command: ["alembic", "upgrade", "head"]
    networks:
      - backend
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    image: ${TRAINMATE_API_IMAGE:?必须设置 TRAINMATE_API_IMAGE}
    env_file:
      - ${TRAINMATE_ENV_FILE:?必须设置 TRAINMATE_ENV_FILE}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?必须设置 API_DOMAIN}
      DOLLAR: "$"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/api.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /etc/nginx/conf.d:size=1m
      - /var/run:size=8m
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - backend

  ops-api:
    image: ${TRAINMATE_API_IMAGE:?必须设置 TRAINMATE_API_IMAGE}
    env_file:
      - ${TRAINMATE_ENV_FILE:?必须设置 TRAINMATE_ENV_FILE}
    command: ["uvicorn", "app.ops_main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  ops-web:
    image: ${TRAINMATE_OPS_WEB_IMAGE:?必须设置 TRAINMATE_OPS_WEB_IMAGE}
    depends_on:
      - ops-api
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=8m
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  purge-deletions:
    image: ${TRAINMATE_API_IMAGE:?必须设置 TRAINMATE_API_IMAGE}
    env_file:
      - ${TRAINMATE_ENV_FILE:?必须设置 TRAINMATE_ENV_FILE}
    command: ["python", "-m", "app.jobs.purge_deletions"]
    networks:
      - backend
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    profiles:
      - jobs

networks:
  edge:
  backend:
