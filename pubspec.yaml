name: trainflow_ai
description: "TrainFlow AI 训练决策辅助系统 MVP，基于现有 Flutter UI 底座改造"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理 - Riverpod
  flutter_riverpod: ^3.0.3

  # 路由管理
  go_router: ^17.0.0

  # 存储
  shared_preferences: ^2.3.4

  # 屏幕适配
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/exercises/
    - assets/images/exercises/free-exercise-db/
    - assets/images/icons/
    - assets/fonts/
