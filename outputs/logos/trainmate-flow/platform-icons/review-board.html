<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智练 TrainMate｜平台图标接入检查</title>
<style>
body { margin: 0; font-family: Arial, sans-serif; background: #fff; color: #181818; }
main { padding: 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; align-items: start; }
figure { margin: 0; }
img { width: 100%; height: auto; display: block; border: 1px solid #e5e5e5; border-radius: 8px; background: #fafafa; }
figcaption { margin-top: 8px; font-size: 13px; line-height: 1.3; color: #333; }
.prompt-card { border: 1px solid #e5e5e5; border-radius: 8px; padding: 14px; background: #fafafa; }
.prompt-card figcaption { margin-top: 0; font-weight: 700; }
.prompt-card figcaption span { display: inline-block; margin-left: 6px; color: #7a4b16; font-weight: 600; }
.prompt-card p { margin: 10px 0 0; font-size: 12px; line-height: 1.45; color: #555; }
.empty-state { border: 1px solid #e5e5e5; border-radius: 8px; padding: 18px; color: #555; background: #fafafa; }

</style>
</head>
<body><main><div class="grid"><figure><a href="full/ios-app-icon-1024.png"><img src="full/ios-app-icon-1024.png" alt="iOS｜标准图标 1024px"></a><figcaption>01. iOS｜标准图标 1024px</figcaption></figure><figure><a href="full/android-legacy-192.png"><img src="full/android-legacy-192.png" alt="Android｜旧式图标 192px"></a><figcaption>02. Android｜旧式图标 192px</figcaption></figure><figure><a href="full/android-adaptive-foreground-432.png"><img src="full/android-adaptive-foreground-432.png" alt="Android｜自适应前景 432px"></a><figcaption>03. Android｜自适应前景 432px</figcaption></figure><figure><a href="full/web-maskable-512.png"><img src="full/web-maskable-512.png" alt="Web｜Maskable 512px"></a><figcaption>04. Web｜Maskable 512px</figcaption></figure><figure><a href="small/app-icon-16.png"><img src="small/app-icon-16.png" alt="原始像素｜16px"></a><figcaption>05. 原始像素｜16px</figcaption></figure><figure><a href="small/app-icon-24.png"><img src="small/app-icon-24.png" alt="原始像素｜24px"></a><figcaption>06. 原始像素｜24px</figcaption></figure><figure><a href="small/app-icon-32.png"><img src="small/app-icon-32.png" alt="原始像素｜32px"></a><figcaption>07. 原始像素｜32px</figcaption></figure><figure><a href="small/app-icon-48.png"><img src="small/app-icon-48.png" alt="原始像素｜48px"></a><figcaption>08. 原始像素｜48px</figcaption></figure></div></main></body>
